[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptcgl"
version = "0.1.0"
description = "PTCGL の英語カードを画面から認識し、日本語版カード画像を表示する Windows アプリ"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "PySide6>=6.7",
  "mss>=9.0",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "Pillow>=10.0",
  "rapidocr-onnxruntime>=1.3",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "rapidfuzz>=3.6",
  "platformdirs>=4.0",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-qt>=4.4",
  "ruff>=0.5",
  "mypy>=1.10",
  "pyinstaller>=6.0",
]

[project.scripts]
ptcgl = "ptcgl.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ptcgl = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "W"]
ignore = ["N802", "N815"]  # Qt のメソッド名（camelCase）を許容

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
